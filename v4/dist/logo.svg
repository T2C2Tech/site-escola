<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0096FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="20" y1="15" x2="100" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#FFC700"/>
    </linearGradient>
    <linearGradient id="tangerineGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <!-- Escudo Circular Vibrante -->
  <circle cx="60" cy="60" r="56" fill="url(#skyGrad)" stroke="#FFC700" stroke-width="5"/>
  <!-- Arco-íris / Base Verde-Limão -->
  <path d="M14 86 C35 68, 85 68, 106 86 C96 104, 79 114, 60 114 C41 114, 24 104, 14 86 Z" fill="#65C11F"/>
  <!-- Coroa Real do Reinado da Criança -->
  <path d="M26 74 L32 40 L48 56 L60 30 L72 56 L88 40 L94 74 Z" fill="url(#sunGrad)" stroke="#0F2537" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="26" y="72" width="68" height="11" rx="5.5" fill="url(#tangerineGrad)" stroke="#0F2537" stroke-width="3.5"/>
  <!-- Joias Coloridas da Coroa -->
  <circle cx="32" cy="34" r="5" fill="#FF6B00" stroke="#0F2537" stroke-width="2.5"/>
  <circle cx="60" cy="24" r="6" fill="#65C11F" stroke="#0F2537" stroke-width="2.5"/>
  <circle cx="88" cy="34" r="5" fill="#FF6B00" stroke="#0F2537" stroke-width="2.5"/>
  <!-- Coração Afetivo no Centro da Coroa -->
  <path d="M60 66 C60 66 50 59 50 53 C50 49.5 53 47 56 47 C58 47 59.5 48 60 49.5 C60.5 48 62 47 64 47 C67 47 70 49.5 70 53 C70 59 60 66 60 66 Z" fill="#FF6B00" stroke="#0F2537" stroke-width="2.5"/>
</svg>
