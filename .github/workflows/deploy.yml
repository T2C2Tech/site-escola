name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'v2/package-lock.json'

      - name: Install and Build v2
        run: |
          cd v2
          npm ci
          npm run build

      - name: Install and Build v3
        run: |
          cd v3
          npm ci
          npm run build

      - name: Install and Build v4
        run: |
          cd v4
          npm ci
          npm run build

      - name: Install and Build v5
        run: |
          cd v5
          npm ci
          npm run build

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site/v2 _site/v3 _site/v4 _site/v5
          # Copia a Versão 1 para a raiz
          cp index.html _site/
          cp -r logo.png _site/ 2>/dev/null || true
          cp -r design _site/ 2>/dev/null || true
          touch _site/.nojekyll
          # Copia a build da Versão 2 para /v2
          cp -r v2/dist/* _site/v2/
          # Copia a build da Versão 3 para /v3
          cp -r v3/dist/* _site/v3/
          # Copia a build da Versão 4 para /v4
          cp -r v4/dist/* _site/v4/
          # Copia a build da Versão 5 para /v5
          cp -r v5/dist/* _site/v5/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

